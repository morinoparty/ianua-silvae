# Dependabot configuration.
# Keeps Gradle dependencies, GitHub Actions, and the docs site (npm) up to date.
# Updates are grouped into one PR per ecosystem to avoid PR floods.
# See: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 does not provide the compiler API Next.js requires
      - dependency-name: "typescript"
        versions: [">=7"]
