name: upload_release

on:
  release:
    types: [ published ]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PROJECT_NAME: ianua-silvae

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
    outputs:
      server_version: ${{ steps.version.outputs.server_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle cache setup (via setup-gradle)
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Set version env
        id: version
        run: |
          before="${{ github.event.release.tag_name }}"
          after="${before//v/}"
          echo "SERVER_VERSION=$after" >> $GITHUB_ENV
          echo "server_version=$after" >> $GITHUB_OUTPUT

      - name: Set project version
        run: |
          echo "Releasing version ${{ env.SERVER_VERSION }}"
          sed -i "s/VersionPlaceholder/${{ env.SERVER_VERSION }}/" ./gradle.properties

      - name: Build with Gradle
        run: ./gradlew build -x test

      # Ensure the shadow jar has the stable release file name.
      # The shadow jar is unclassified; the thin jar carries the "plain" classifier.
      # It is usually already named <rootProject.name>-<version>.jar, and `mv` onto
      # the same path fails, so only rename when the paths differ.
      - name: Rename artifact
        run: |
          target="./build/libs/${{ env.PROJECT_NAME }}-${{ env.SERVER_VERSION }}.jar"
          jar_file=$(find ./build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          if [ -z "$jar_file" ]; then
            echo "::error::No shadow jar found in build/libs" >&2
            ls -la ./build/libs >&2 || true
            exit 1
          fi
          if [ "$(realpath "$jar_file")" != "$(realpath -m "$target")" ]; then
            mv "$jar_file" "$target"
          fi
          ls -la ./build/libs

      # Sign the JAR with GitHub Attestations
      - name: Attest JAR artifact
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: './build/libs/${{ env.PROJECT_NAME }}-${{ env.SERVER_VERSION }}.jar'

      # Share the jar with the deploy job
      - name: Upload JAR artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-jar
          path: ./build/libs/${{ env.PROJECT_NAME }}-${{ env.SERVER_VERSION }}.jar
          retention-days: 1

      # Attach the shadow jar to the GitHub release
      - name: Upload JAR to GitHub Release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ./build/libs/${{ env.PROJECT_NAME }}-${{ env.SERVER_VERSION }}.jar \
            --clobber

      # Append the SLSA provenance verification link to the release notes
      - name: Append SLSA provenance link to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          gh release view "$TAG" --json body -q .body > notes.md
          cat << EOF >> notes.md

          ## 🔏 Provenance (SLSA)

          Verify with \`gh attestation verify <jar-file> --owner morinoparty\`, or check the attestation directly:
          - [View attestation]($ATTESTATION_URL)
          EOF
          gh release edit "$TAG" --notes-file notes.md

  # Replace the server jar on the production server via Pelican Panel and restart it
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    env:
      SERVER_VERSION: ${{ needs.build.outputs.server_version }}
      PANEL_URL: ${{ secrets.PELICAN_PANEL_URL }}
      SERVER_UUID: ${{ secrets.PELICAN_SERVER_UUID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fetch the Pelican client API key from Bitwarden Secrets Manager
      - name: Fetch secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            8db4963b-cfea-486a-93cf-b49900dd8a2d > API_KEY

      - name: Download JAR artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-jar
          path: ./artifacts

      # Delete the old jar, upload the new one, and restart the server
      - name: Deploy and restart
        run: ./.github/scripts/pelican-deploy.sh
